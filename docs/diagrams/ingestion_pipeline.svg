<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 620" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="seqBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#0e1320"/>
      <stop offset="100%" stop-color="#070a10"/>
    </linearGradient>

    <!-- Header Box Gradients -->
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Arrow Marker -->
    <marker id="seqArrowViolet" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#a78bfa" />
    </marker>
    <marker id="seqArrowCyan" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#38bdf8" />
    </marker>
    <marker id="seqArrowEmerald" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#34d399" />
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="1160" height="620" rx="16" fill="url(#seqBgGrad)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Title Header -->
  <g transform="translate(60, 48)">
    <text font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="22" fill="#ffffff" letter-spacing="-0.5">
      DevLens AI <tspan fill="#38bdf8" font-size="14" font-weight="700" font-family="monospace">INGESTION &amp; EVIDENCE PIPELINE</tspan>
    </text>
    <text y="22" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="12" fill="#94a3b8">
      Traceable Sequence from Candidate Ingestion to Cryptographic Evidence Verification
    </text>
  </g>

  <!-- PARTICIPANT HEADERS -->
  <!-- 1. Recruiter / Admin -->
  <g transform="translate(70, 95)">
    <rect width="140" height="42" rx="8" fill="url(#boxGrad)" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="70" y="26" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="12" fill="#f8fafc" text-anchor="middle">
      Recruiter / Admin
    </text>
  </g>
  <line x1="140" y1="137" x2="140" y2="570" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- 2. Ingestion Gateway -->
  <g transform="translate(270, 95)">
    <rect width="150" height="42" rx="8" fill="url(#boxGrad)" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="75" y="26" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="12" fill="#a78bfa" text-anchor="middle">
      Ingestion Gateway
    </text>
  </g>
  <line x1="345" y1="137" x2="345" y2="570" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- 3. GitHub / Parser -->
  <g transform="translate(480, 95)">
    <rect width="160" height="42" rx="8" fill="url(#boxGrad)" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="80" y="26" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="12" fill="#38bdf8" text-anchor="middle">
      GitHub API / Parser
    </text>
  </g>
  <line x1="560" y1="137" x2="560" y2="570" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- 4. Evidence Verifier -->
  <g transform="translate(700, 95)">
    <rect width="150" height="42" rx="8" fill="url(#boxGrad)" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="75" y="26" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="12" fill="#60a5fa" text-anchor="middle">
      Evidence Verifier
    </text>
  </g>
  <line x1="775" y1="137" x2="775" y2="570" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- 5. State Store -->
  <g transform="translate(900, 95)">
    <rect width="140" height="42" rx="8" fill="url(#boxGrad)" stroke="#10b981" stroke-width="1.5"/>
    <text x="70" y="26" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="12" fill="#34d399" text-anchor="middle">
      State Store / DB
    </text>
  </g>
  <line x1="970" y1="137" x2="970" y2="570" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- SEQUENCE STEPS -->

  <!-- Step 1: Submit Candidate -->
  <g transform="translate(0, 180)">
    <line x1="140" y1="0" x2="337" y2="0" stroke="#a78bfa" stroke-width="2" marker-end="url(#seqArrowViolet)"/>
    <rect x="180" y="-18" width="115" height="22" rx="4" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
    <text x="237" y="-3" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#c7d2fe" text-anchor="middle">
      1. Submit Candidate
    </text>
  </g>

  <!-- Step 2: SSRF Self-Call -->
  <g transform="translate(0, 235)">
    <path d="M 345 0 L 390 0 L 390 25 L 353 25" stroke="#a78bfa" stroke-width="1.5" fill="none" marker-end="url(#seqArrowViolet)"/>
    <rect x="395" y="2" width="140" height="22" rx="4" fill="#18181b" stroke="#71717a" stroke-width="1"/>
    <text x="465" y="17" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="500" fill="#e4e4e7" text-anchor="middle">
      2. Enforce SSRF &amp; Domain
    </text>
  </g>

  <!-- Step 3: Ingest Repos -->
  <g transform="translate(0, 295)">
    <line x1="345" y1="0" x2="552" y2="0" stroke="#38bdf8" stroke-width="2" marker-end="url(#seqArrowCyan)"/>
    <rect x="385" y="-18" width="130" height="22" rx="4" fill="#082f49" stroke="#0284c7" stroke-width="1"/>
    <text x="450" y="-3" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#bae6fd" text-anchor="middle">
      3. Ingest All Repositories
    </text>
  </g>

  <!-- Step 4: Return Raw Repositories -->
  <g transform="translate(0, 350)">
    <line x1="560" y1="0" x2="353" y2="0" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#seqArrowCyan)"/>
    <rect x="395" y="-18" width="125" height="22" rx="4" fill="#0c4a6e" stroke="#0ea5e9" stroke-width="1"/>
    <text x="457" y="-3" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="500" fill="#e0f2fe" text-anchor="middle">
      4. Raw Repos &amp; Tests
    </text>
  </g>

  <!-- Step 5: Extract Skills & Test Proof -->
  <g transform="translate(0, 410)">
    <line x1="345" y1="0" x2="767" y2="0" stroke="#60a5fa" stroke-width="2" marker-end="url(#seqArrowCyan)"/>
    <rect x="495" y="-18" width="135" height="22" rx="4" fill="#1e3a8a" stroke="#2563eb" stroke-width="1"/>
    <text x="562" y="-3" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#bfdbfe" text-anchor="middle">
      5. Extract Verified Proof
    </text>
  </g>

  <!-- Step 6: Save Profile + Evidence Trail -->
  <g transform="translate(0, 470)">
    <line x1="775" y1="0" x2="962" y2="0" stroke="#34d399" stroke-width="2" marker-end="url(#seqArrowEmerald)"/>
    <rect x="815" y="-18" width="120" height="22" rx="4" fill="#064e3b" stroke="#059669" stroke-width="1"/>
    <text x="875" y="-3" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#a7f3d0" text-anchor="middle">
      6. Save Verified Trail
    </text>
  </g>

  <!-- Step 7: Dossier Render Notification to Recruiter -->
  <g transform="translate(0, 525)">
    <line x1="970" y1="0" x2="148" y2="0" stroke="#34d399" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#seqArrowEmerald)"/>
    <rect x="455" y="-18" width="200" height="22" rx="4" fill="#022c22" stroke="#10b981" stroke-width="1"/>
    <text x="555" y="-3" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#6ee7b7" text-anchor="middle">
      7. Real-Time Dossier Render &amp; Score
    </text>
  </g>
</svg>
